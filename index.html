<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دانه‌های شناور</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8d3c8;--ink:#23201c;--mut:#6f695e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Aref Ruqaa",Tahoma,serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
button,.btn{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:2px solid var(--ink);padding:4px 13px 7px;cursor:pointer;border-radius:255px 18px 225px 20px/20px 225px 18px 255px;transform:rotate(-1.2deg)}
.btn{display:inline-block;transform:rotate(.7deg);border-radius:20px 230px 18px 250px/240px 18px 230px 20px}
button:nth-child(2){transform:rotate(.9deg);border-radius:20px 240px 16px 250px/250px 16px 230px 20px}
button:nth-child(3){transform:rotate(-.5deg);border-radius:230px 22px 250px 14px/16px 250px 22px 230px}
button:hover{background:rgba(128,128,128,.14)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.thumbs{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:20px;justify-content:center}
.thumbs .th{cursor:pointer;width:40px;height:54px;padding:0;overflow:hidden;font-size:24px;line-height:1;display:grid;place-items:center;background:transparent;border:2px solid var(--ink);color:var(--ink)}
.thumbs .th:nth-child(odd){border-radius:14px 4px 12px 6px/6px 12px 4px 14px;transform:rotate(-1.6deg)}
.thumbs .th:nth-child(even){border-radius:5px 14px 6px 12px/12px 6px 14px 4px;transform:rotate(1.3deg)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.empty{border-style:dashed;color:var(--mut);border-color:var(--mut)}
.th.on{outline:2px solid var(--ink);outline-offset:3px}
#fi{position:fixed;left:-20px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.note{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:16px;font-size:15px;color:var(--mut);transform:rotate(1.5deg)}
#gear{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:64vh;overflow:auto;background:var(--bg);border-top:2px solid var(--ink);border-radius:26px 8px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:5}
.sheet[hidden]{display:none}
.sheet button{transform:none;border-radius:12px 4px 10px 5px/5px 10px 4px 12px;font-size:14px;padding:2px 10px 5px}
.sheet h2{margin:0 0 6px;font-size:20px}
.row{margin:12px 0}.row>b{display:block;font-weight:400;font-size:14px;color:var(--mut);margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.cnt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tx{width:150px;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:2px}
#cn{width:96px;font:inherit;font-size:18px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);text-align:center;padding:2px;direction:ltr}
input[type=range]{width:100%;accent-color:var(--ink);direction:ltr}
.info{font-size:13px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<canvas id="c" aria-label="تصویر ساخته‌شده از دانه‌های شناور"></canvas>
<div class="note" id="note"></div>
<button id="gear" aria-expanded="false">تنظیمات</button>
<div class="thumbs" id="thumbs"></div>
<input type="file" id="fi" accept="image/*" multiple>
<div class="bar">
  <button id="b1" aria-pressed="false">پخش کن</button>
  <button id="b2" aria-pressed="true">بساز</button>
  <button id="b3" aria-pressed="true">خودکار</button>
  <label id="b4" class="btn" for="fi">عکس بگذار</label>
</div>
<div class="sheet" id="sheet" hidden>
  <h2>تنظیمات دانه‌ها</h2>
  <div class="row"><b>تعداد دانه (هر دانه = یک پیکسل)</b>
    <div class="cnt"><button id="cm" aria-label="کمتر">−</button><input id="cn" type="text" inputmode="numeric" aria-label="تعداد دانه"><button id="cp" aria-label="بیشتر">+</button>
    <button data-n="2000">۲ هزار</button><button data-n="8000">۸ هزار</button><button data-n="19200">پیش‌فرض</button><button data-n="40000">۴۰ هزار</button><button data-n="80000">۸۰ هزار</button></div>
    <input id="cs" type="range" min="0" max="100" step="1" aria-label="اسلایدر تعداد">
    <div class="info" id="info"></div></div>
  <div id="pc"></div>
  <div class="row"><b>ایده‌های تازه</b><div class="seg"><button id="blow">فوت کن</button><button id="untext">برگرد به عکس</button></div>
    <div class="cnt" style="margin-top:8px"><input id="tx" type="text" placeholder="یک کلمه بنویس…" maxlength="24" aria-label="متن"><button id="tbtn">با دانه‌ها بنویس</button></div></div>
  <div class="row"><button id="reset">بازنشانی همه</button></div>
</div>

  let a=sw,b=sh;if(sw/sh>tr)a=sh*tr;else b=sw/tr;
  g.drawImage(el,(sw-a)/2,(sh-b)*.2,a,b,0,0,W,H);
  return g.getImageData(0,0,W,H).data;
}
function sample(el){
  const d=pixels(el),t=document.createElement('canvas');t.width=60;t.height=80;
  const g=t.getContext('2d');g.drawImage(el,0,0,60,80);
  return {el:el,d:d,thumb:t.toDataURL()};
}
function paint(s){
  const d=s.d,m=cfg.color,cl=x=>x<0?0:x>255?255:x;
  for(let i=0;i<N;i++){
    const j=i*4,v=JV[i];let r=d[j],g=d[j+1],b=d[j+2];
    if(m){const l=.299*r+.587*g+.114*b;
      if(m===1){r=g=b=l}else if(m===2){r=l*1.12+16;g=l*.96+6;b=l*.7}else{r=255-r;g=255-g;b=255-b}}
    COL[i]=(255<<24)|(cl(b+v)<<16)|(cl(g+v)<<8)|cl(r+v);
  }
}
function clampN(n){n=Math.round(Number(n));return isFinite(n)?Math.max(MIN,Math.min(MAX,n)):cfg.count}
function rebuild(n){
  cfg.count=clampN(n);
  W=Math.max(8,Math.round(Math.sqrt(cfg.count*3/4)));H=Math.round(W*4/3);N=W*H;
  alloc();initP();
  slots.forEach(s=>{if(s)s.d=pixels(s.el)});
  layout();if(slots[cur])paint(slots[cur]);
  syncUI();save();
}
function applyCount(n){
  rebuild(n);setMode(false);clearTimeout(ct);ct=setTimeout(()=>setMode(true),380);
}
function syncUI(){
  $('cn').value=cfg.count;
  $('cs').value=Math.round(Math.log(cfg.count/MIN)/Math.log(MAX/MIN)*100);
  $('info').textContent='شبکه‌ی '+fa(W)+'×'+fa(H)+' = '+fa(N)+' دانه (بین '+fa(MIN)+' و '+fa(MAX)+')';
  $('note').textContent=fa(N)+' دانه، هر کدام یک پیکسل';
}
function showSlot(k){
  if(!slots[k])return;cur=k;renderThumbs();setMode(false);
  setTimeout(()=>{if(cur===k){paint(slots[k]);setMode(true)}},1100);
}
function renderThumbs(){
  const tb=$('thumbs');tb.innerHTML='';
  for(let k=0;k<5;k++){
    const b=document.createElement(slots[k]?'button':'label');if(!slots[k])b.htmlFor='fi';
    b.className='th'+(slots[k]?'':' empty')+(k===cur&&slots[k]?' on':'');
    b.setAttribute('aria-label',slots[k]?'نمایش عکس '+(k+1):'افزودن عکس');
    if(slots[k]){const im=document.createElement('img');im.src=slots[k].thumb;im.alt='';b.appendChild(im)}else b.textContent='+';
    b.onclick=()=>{if(slots[k])showSlot(k);else{pickK=k;fi.value=''}};
    tb.appendChild(b);
  }
}
function modeBtns(){$('b1').setAttribute('aria-pressed',String(!assembled));$('b2').setAttribute('aria-pressed',String(assembled))}
function blow(){
  clearTimeout(ct);blowing=true;assembled=false;modeT=tNow;timer=0;REL.fill(0);
  for(let i=0;i<N;i++)RL[i]=tNow+((i%W)/W)*1.5+rnd()*.35;
  scatterTargets();modeBtns();ct=setTimeout(()=>setMode(true),5200);
}
function setText(str,keep){
  str=(str||'').trim();if(!str)return;
  const tw=Math.round(Math.min(cw-20,W*S)),th=Math.max(40,Math.round(H*S*.5));
  const c=document.createElement('canvas');c.width=tw;c.height=th;const g=c.getContext('2d');
  g.direction='rtl';g.textAlign='center';g.textBaseline='middle';
  const fam='"Aref Ruqaa",Tahoma,serif';let fs=th*.8;
  g.font='700 '+fs+'px '+fam;const m=g.measureText(str).width;if(m>tw*.94)fs*=tw*.94/m;
  g.font='700 '+fs+'px '+fam;g.fillText(str,tw/2,th/2);
  const d=g.getImageData(0,0,tw,th).data,pts=[];
  for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(d[(y*tw+x)*4+3]>128)pts.push(x,y);
  const P=pts.length/2,use=Math.min(P,Math.floor(N*.65));
  const idx=new Uint32Array(P);for(let i=0;i<P;i++)idx[i]=i;
  for(let i=0;i<use;i++){const j=i+((rnd()*(P-i))|0),q=idx[i];idx[i]=idx[j];idx[j]=q}
  const perm=new Uint32Array(N);for(let i=0;i<N;i++)perm[i]=i;
  for(let i=N-1;i>0;i--){const j=(rnd()*(i+1))|0,q=perm[i];perm[i]=perm[j];perm[j]=q}
  TF.fill(0);
  const x0=(cw-tw)/2,y0=oy+H*S/2-th/2;
  for(let j=0;j<use;j++){const i=perm[j],pi=idx[j];TX[i]=x0+pts[pi*2];TY[i]=y0+pts[pi*2+1];TF[i]=1}
  txt=true;lastText=str;
  if(!keep){setMode(true);modeT=tNow-10}
}
function hideSheet(){$('sheet').hidden=true;$('gear').setAttribute('aria-expanded','false')}
function buildPanel(){
  let h='';
  SL.forEach(s=>{h+=`<div class="row"><b>${s[1]}</b><input type="range" data-k="${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${cfg[s[0]]}"></div>`});
  SEG.forEach(s=>{h+=`<div class="row"><b>${s[1]}</b><div class="seg">`+s[2].map((l,i)=>`<button data-s="${s[0]}" data-v="${i}" aria-pressed="${cfg[s[0]]===i}">${l}</button>`).join('')+'</div></div>'});
  h+='<div class="row"><div class="seg">'+TG.map(t=>`<button data-t="${t[0]}" aria-pressed="${!!cfg[t[0]]}">${t[1]}</button>`).join('')+'</div></div>';
  $('pc').innerHTML=h;
}
$('pc').addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.dataset.s){
    const k=b.dataset.s;cfg[k]=+b.dataset.v;
    if(k==='color'&&slots[cur])paint(slots[cur]);
    else if(k==='order')computeDL();
    else if(k==='scatter'&&!assembled)scatterTargets();
    else if(k==='theme')applyTheme();
    if(k==='order'||k==='scatter'){setMode(false);clearTimeout(ct);ct=setTimeout(()=>setMode(true),700)}
  }else if(b.dataset.t){cfg[b.dataset.t]=!cfg[b.dataset.t]}
  save();buildPanel();
});
$('pc').addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  cfg[k]=+e.target.value;if(k==='size')applySizes();save();
});
let dbt=0;
$('cs').addEventListener('input',()=>{
  const n=Math.round(MIN*Math.pow(MAX/MIN,$('cs').value/100));
  $('cn').value=n;clearTimeout(dbt);dbt=setTimeout(()=>applyCount(n),160);
});
const norm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
$('cn').addEventListener('change',()=>applyCount(norm($('cn').value)||cfg.count));
$('cn').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('cm').onclick=()=>applyCount(cfg.count/1.25);
$('cp').onclick=()=>applyCount(cfg.count*1.25);
$('sheet').addEventListener('click',e=>{const n=e.target.dataset&&e.target.dataset.n;if(n)applyCount(+n)});
$('blow').onclick=()=>{blow();hideSheet()};
$('untext').onclick=()=>{txt=false;setMode(true);modeT=tNow-10;hideSheet()};
$('tbtn').onclick=()=>{setText($('tx').value);hideSheet()};
$('tx').addEventListener('keydown',e=>{if(e.key==='Enter'){setText($('tx').value);hideSheet()}});
$('reset').onclick=()=>{txt=false;Object.assign(cfg,DEF);applyTheme();buildPanel();if(slots[cur])paint(slots[cur]);computeDL();applyCount(DEF.count)};
$('gear').onclick=()=>{const s=$('sheet');s.hidden=!s.hidden;$('gear').setAttribute('aria-expanded',String(!s.hidden));if(!s.hidden)buildPanel()};

const fi=$('fi');
fi.onchange=()=>{
  const fs=[...fi.files].slice(0,5);let n=0;
  fs.forEach((f,idx)=>{
    const k=(pickK+idx)%5,r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{slots[k]=sample(im);if(++n===fs.length)showSlot(pickK)};im.src=r.result};
    r.readAsDataURL(f);
  });
};
$('b1').onclick=()=>setMode(false);$('b2').onclick=()=>setMode(true);
$('b4').addEventListener('click',()=>{const e=slots.indexOf(null);pickK=e>=0?e:cur;fi.value=''});
$('b3').onclick=()=>{auto=!auto;$('b3').setAttribute('aria-pressed',String(auto));timer=0};
addEventListener('resize',()=>{layout();if(slots[cur])paint(slots[cur]);if(txt)setText(lastText,true)});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const f=slots.map((s,k)=>s?k:-1).filter(k=>k>=0);
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const d=e.key==='ArrowLeft'?1:-1;showSlot(f[(f.indexOf(cur)+d+f.length)%f.length])}
  else if(e.key===' '){e.preventDefault();setMode(!assembled)}
});
function mv(e){const r=cv.getBoundingClientRect(),nx=e.clientX-r.left,ny=e.clientY-r.top;
  if(mouse.x>-999){mvx=Math.max(-40,Math.min(40,mvx*.5+(nx-mouse.x)*.5));mvy=Math.max(-40,Math.min(40,mvy*.5+(ny-mouse.y)*.5))}
  mouse.x=nx;mouse.y=ny}
cv.addEventListener('pointermove',mv);
cv.addEventListener('pointerdown',e=>{mv(e);rip.push({x:mouse.x,y:mouse.y,t0:tNow,a:cfg.attract?-.9:1});
  const R=S*8*cfg.touch,sg=cfg.attract?-1:1;
  for(let i=0;i<N;i++){const dx=X[i]-mouse.x,dy=Y[i]-mouse.y,d=Math.hypot(dx,dy);
    if(d<R){const f=(1-d/R)*7*sg/MS[i];VX[i]+=dx/(d+1)*f;VY[i]+=dy/(d+1)*f}}});
const off=()=>{mouse.x=mouse.y=-9999};
cv.addEventListener('pointerleave',off);
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')off()});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const img=new Image();
img.onload=()=>{
  applyTheme();
  W=Math.max(8,Math.round(Math.sqrt(clampN(cfg.count)*3/4)));H=Math.round(W*4/3);N=W*H;cfg.count=clampN(cfg.count);
  alloc();initP();
  slots[0]=sample(img);layout();paint(slots[0]);renderThumbs();syncUI();buildPanel();
  setMode(false);setTimeout(()=>setMode(true),400);
  requestAnimationFrame(loop);
};
img.src=SRC;

function loop(ms){
  const t=ms*.001;tNow=t;const dt=Math.min(.05,t-last||.016);last=t;const s=dt*60;
  if(auto&&!blowing&&!txt){timer+=dt;if(timer>(assembled?10:3.5)){if(assembled){const f=slots.map((s,k)=>s?k:-1).filter(k=>k>=0);if(f.length>1)showSlot(f[(f.indexOf(cur)+1)%f.length]);else setMode(false)}else setMode(true)}}
  if(cfg.beat&&assembled&&!txt&&t-lastBeat>1.3){lastBeat=t;const cx=cw/2,cy=oy+H*S*.42;rip.push({x:cx,y:cy,t0:t,a:.7});rip.push({x:cx,y:cy,t0:t+.22,a:.45})}
  while(rip.length&&t-rip[0].t0>3.2)rip.shift();
  const calm=reduce||cfg.freeze,fl=calm?0:cfg.float;
  const R=S*9*cfg.touch,R2=R*R,sg=cfg.attract?-.8:1,sgn=cfg.attract?-1:1;
  const mx=mouse.x,my=mouse.y,on=mx>-999;
  const dampA=Math.pow(.87,s),airD=Math.pow(.985,s);
  par.x+=((cfg.parallax&&on?mx/cw-.5:0)-par.x)*.06*s;par.y+=((cfg.parallax&&on?my/ch-.5:0)-par.y)*.06*s;
  const k9=Math.pow(.9,s);mvx*=k9;mvy*=k9;
  const since=t-modeT,fall=cfg.scatter===2&&!blowing,G=.42*s;
  const wx=calm?0:Math.sin(t*.37)*.05*fl*s,wy=calm?0:Math.cos(t*.29)*.03*fl*s;
  const nr=rip.length,rv=S*70,rw=S*7;
  for(let i=0;i<N;i++){
    if(blowing&&!REL[i]&&t>=RL[i]){REL[i]=1;VX[i]+=4+rnd()*7;VY[i]+=(rnd()-.65)*4}
    let home=false,bx,by;
    if(blowing){home=t<RL[i];if(home){bx=HX[i];by=HY[i]}else{bx=SX[i];by=SY[i]}}
    else if(assembled&&since>DL[i]){
      if(txt){if(TF[i]){bx=TX[i];by=TY[i];home=true}else{bx=SX[i];by=SY[i]}}
      else{const z=DP[i]-.5;bx=HX[i]+par.x*z*S*16;by=HY[i]+par.y*z*S*16;home=true}
    }else{bx=SX[i];by=SY[i]}
    const x=X[i],y=Y[i],im=1/MS[i];
    let ax=0,ay=0;
    const free=fall&&!home;
    if(free)ay=G;
    else{
      const kk=(home?K[i]:K[i]*.3)*s,a=calm?0:(home?S*.5*fl:S*5*Math.max(fl,.3));
      ax=(bx+Math.sin(t*FR[i]+PH[i])*a-x)*kk;ay=(by+Math.cos(t*FR2[i]+PH2[i])*a*.8-y)*kk;
      if(!calm){
        const fx=Math.sin(y*.012+t*.4)+.6*Math.sin(y*.031-t*.23+x*.007),fy=Math.cos(x*.012-t*.35)+.6*Math.cos(x*.027+t*.27+y*.009);
        const f=(home?.006:.05)*fl*im*s;ax+=fx*f;ay+=fy*f;
      }
    }
    for(let r=0;r<nr;r++){const rp=rip[r],age=t-rp.t0;if(age<0)continue;
      const dx=x-rp.x,dy=y-rp.y,d=Math.sqrt(dx*dx+dy*dy)+.001,u=(d-age*rv)/rw;if(u>3||u<-3)continue;
      const g=Math.exp(-u*u)*rp.a*(1-age/3.2)*.55*im*s;ax+=dx/d*g;ay+=dy/d*g}
    const mdx=x-mx,mdy=y-my,d2=mdx*mdx+mdy*mdy;
    if(d2<R2){const d=Math.sqrt(d2)+.001,q=1-d/R,f=q*q*2.4*sg*im*s;
      ax+=mdx/d*f-mdy/d*f*.45*sgn;ay+=mdy/d*f+mdx/d*f*.45*sgn;
      ax+=mvx*q*.05*im*s;ay+=mvy*q*.05*im*s}
    ax+=wx;ay+=wy;
    let vx=(VX[i]+ax)*(free?airD:dampA),vy=(VY[i]+ay)*(free?airD:dampA),nx=x+vx*s,ny=y+vy*s;
    if(free){
      if(ny>SY[i]){ny=SY[i];vy*=-.38;vx*=.8;if(Math.abs(vy)<.4)vy=0}
      if(nx<0){nx=0;vx=-vx*.5}else if(nx>cw){nx=cw;vx=-vx*.5}
    }
    VX[i]=vx;VY[i]=vy;X[i]=nx;Y[i]=ny;
  }
  buf.set(paper);
  const cwp=cv.width,chp=cv.height,sh=cfg.shape,lt=cfg.light,Rl=S*28,Rl2=Rl*Rl;
  if(on){lx+=(mx-lx)*.2*s;ly+=(my-ly)*.2*s}
  for(let i=0;i<N;i++){
    let w=PW[i],h=PHH[i];
    if(sh===2){w=Math.max(1,Math.round(w*.4));h=Math.round(h*1.35)}
    const x0=(X[i]*dpr-w/2)|0,y0=(Y[i]*dpr-h/2)|0;let c=COL[i];
    if(x0<0||y0<0||x0+w>cwp||y0+h>chp)continue;
    if(lt){const dx=X[i]-lx,dy=Y[i]-ly,dd=dx*dx+dy*dy;let f=.1;
      if(dd<Rl2){const q=1-Math.sqrt(dd)/Rl;f=.1+.9*q*q*(3-2*q)}
      c=(255<<24)|((((c>>16)&255)*f)<<16)|((((c>>8)&255)*f)<<8)|((c&255)*f)}
    if(sh===1&&w>2){
      const rx=w/2,ry=h/2;
      for(let yy=0;yy<h;yy++){const ny=(yy+.5-ry)/ry,hf=Math.sqrt(Math.max(0,1-ny*ny))*rx,a=Math.max(0,Math.round(rx-hf));
        let o=(y0+yy)*cwp+x0+a;for(let xx=a;xx<w-a;xx++)buf[o++]=c}
    }else for(let yy=0;yy<h;yy++){let o=(y0+yy)*cwp+x0;for(let xx=0;xx<w;xx++)buf[o++]=c}
  }
  ctx.putImageData(imgData,0,0);
  requestAnimationFrame(loop);
}
</script>
